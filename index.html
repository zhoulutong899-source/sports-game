<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>跑步游戏 | 달리기 게임</title>
<style>
    body {
        margin: 0;
        background: linear-gradient(#dff3ff, #9bd1ff);
        font-family: Arial, sans-serif;
    }

    #loginScreen, #gameScreen {
        display: none;
        text-align: center;
        padding-top: 40px;
    }

    #loginScreen {
        display: block;
    }

    .title {
        font-size: 30px;
        font-weight: bold;
        margin-bottom: 20px;
        color: #003366;
    }

    #playerName {
        width: 260px;
        padding: 10px;
        font-size: 18px;
    }

    #startBtn {
        margin-top: 20px;
        padding: 10px 30px;
        font-size: 18px;
        background: #0077ff;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    #track {
        width: 900px;
        height: 400px;
        background: #444;
        margin: 20px auto;
        border-radius: 10px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 15px rgba(0,0,0,0.4);
    }

    .line {
        position: absolute;
        width: 100%;
        height: 3px;
        background: white;
        opacity: 0.6;
    }

    .runner {
        width: 40px;
        height: 40px;
        background: yellow;
        border-radius: 50%;
        position: absolute;
        left: 10px;
    }

    #player {
        background: #00ff00;
    }

    #info {
        text-align: center;
        font-size: 18px;
        color: #003366;
        margin-top: 10px;
    }

    #rankBoard {
        width: 320px;
        margin: 20px auto;
        padding: 15px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.3);
        text-align: left;
    }

    #rankBoard h3 {
        text-align: center;
        margin-top: 0;
    }
</style>
</head>
<body>

<!-- ================= 登录画面 ================= -->
<div id="loginScreen">
    <div class="title">
        🏃 跑步游戏（中文）<br>
        🏃 달리기 게임 (한국어)
    </div>

    <p>请输入姓名 / 이름을 입력하세요</p>
    <input id="playerName" placeholder="Your Name / 이름" />

    <br>
    <button id="startBtn">开始游戏 / 게임 시작</button>
</div>

<!-- ================= 游戏画面 ================= -->
<div id="gameScreen">
    <h2>🏁 跑步比赛 / 달리기 경기</h2>
    <div id="info">按 ↑ 加速（方向键）<br>↑키를 눌러 속도를 높이세요!</div>

    <div id="track">
        <div class="line" style="top:60px"></div>
        <div class="line" style="top:120px"></div>
        <div class="line" style="top:180px"></div>
        <div class="line" style="top:240px"></div>
        <div class="line" style="top:300px"></div>

        <!-- 玩家 -->
        <div id="player" class="runner" style="top: 20px;"></div>

        <!-- AI 对手 -->
        <div id="ai1" class="runner" style="top: 80px; background:#ff4444;"></div>
        <div id="ai2" class="runner" style="top: 140px; background:#ff8800;"></div>
        <div id="ai3" class="runner" style="top: 200px; background:#00bbff;"></div>
        <div id="ai4" class="runner" style="top: 260px; background:#aa66cc;"></div>
    </div>

    <div id="rankBoard">
        <h3>🏆 排行榜 / 순위표（Top 10）</h3>
        <ol id="rankList"></ol>
    </div>
</div>

<!-- ================= Firebase & Game Script ================= -->
<script type="module">
    // ========== Firebase ==========
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, onValue, query, limitToFirst, orderByChild } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        databaseURL: "YOUR_DATABASE_URL",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // ========== 游戏逻辑 ==========
    const loginScreen = document.getElementById("loginScreen");
    const gameScreen = document.getElementById("gameScreen");
    const playerNameInput = document.getElementById("playerName");
    const startBtn = document.getElementById("startBtn");
    const rankList = document.getElementById("rankList");

    let playerSpeed = 0;
    let aiSpeeds = [2, 2.4, 2.1, 2.3];
    let finished = false;
    let playerName = "";

    const runners = {
        player: document.getElementById("player"),
        ai: [
            document.getElementById("ai1"),
            document.getElementById("ai2"),
            document.getElementById("ai3"),
            document.getElementById("ai4")
        ]
    };

    startBtn.onclick = () => {
        if (!playerNameInput.value.trim()) {
            alert("请输入姓名 / 이름을 입력하세요");
            return;
        }

        playerName = playerNameInput.value.trim();
        loginScreen.style.display = "none";
        gameScreen.style.display = "block";
        startGame();
    };

    function startGame() {
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowUp") {
                playerSpeed += 0.5; // 加速
            }
        });

        requestAnimationFrame(gameLoop);
    }

    function gameLoop() {
        if (finished) return;

        // 玩家前进
        const p = runners.player;
        let x = parseFloat(p.style.left);
        x += playerSpeed * 0.7;
        p.style.left = x + "px";

        // AI 前进
        runners.ai.forEach((ai, i) => {
            let ax = parseFloat(ai.style.left);
            ax += aiSpeeds[i];
            ai.style.left = ax + "px";
        });

        // 判断胜负
        if (x >= 840) {
            finished = true;
            saveScore(1000 - Math.floor(performance.now() / 1000));
            alert("🎉 你赢了！/ 당신이 승리했습니다!");
        }

        requestAnimationFrame(gameLoop);
    }

    // ========== 上传分数 ==========
    function saveScore(score) {
        set(ref(db, "scores/" + Date.now()), {
            name: playerName,
            score: score
        });
    }

    // ========== 实时排行榜 ==========
    const rankQuery = query(
        ref(db, "scores"),
        orderByChild("score"),
        limitToFirst(10)
    );

    onValue(rankQuery, (snapshot) => {
        const data = snapshot.val();
        rankList.innerHTML = "";

        if (data) {
            const arr = Object.values(data).sort((a, b) => a.score - b.score);
            arr.forEach((item) => {
                const li = document.createElement("li");
                li.textContent = `${item.name} — ${item.score}`;
                rankList.appendChild(li);
            });
        }
    });

</script>

</body>
</html>
